<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PresentIt – Admin Template Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="/i18n.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07071a;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: linear-gradient(135deg, #667eea, #764ba2);
      --hot: linear-gradient(135deg, #f093fb, #f5576c);
      --success: #4ade80;
      --danger: #f87171;
      --warning: #fbbf24;
    }

    html, body {
      min-height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      background: var(--hot);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 20px rgba(102,126,234,0.3); }
    .btn-hot { background: var(--hot); color: #fff; box-shadow: 0 4px 20px rgba(240,147,251,0.3); }
    .btn-ghost { background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid var(--card-border); }
    .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,0.1); }
    .btn-danger { background: rgba(248,113,113,0.15); color: var(--danger); border: 1px solid rgba(248,113,113,0.3); }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 24px;
    }

    /* Auth modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(7,7,26,0.9); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-box {
      width: 100%; max-width: 420px; text-align: center;
    }

    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      padding: 12px 16px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #667eea;
    }
    label {
      display: block; font-size: 12px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 6px; text-align: left;
    }

    .template-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
    }
    .template-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--card-border);
      border-radius: 14px; padding: 20px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .template-card h3 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .template-card p { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .template-card .actions { display: flex; gap: 8px; margin-top: auto; }

    /* Slide editor */
    .slide-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      position: relative;
    }
    .slide-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .slide-number { font-size: 13px; font-weight: 800; color: #a5b4fc; }

    .option-row {
      display: flex; gap: 10px; align-items: center; margin-bottom: 8px;
    }
    .img-preview {
      width: 60px; height: 60px; border-radius: 8px; object-fit: cover;
      border: 1px solid var(--card-border); background: #000;
    }

    .badge-type {
      font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
      padding: 4px 10px; border-radius: 100px;
    }
    .badge-text      { background: rgba(102,126,234,0.2); color: #a5b4fc; }
    .badge-photo     { background: rgba(240,147,251,0.2); color: #f093fb; }
    .badge-textphoto { background: rgba(251,191,36,0.2);  color: var(--warning); }
    .badge-predefined{ background: rgba(74,222,128,0.2);  color: var(--success); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- AUTH MODAL -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box card">
      <div style="font-size:40px;margin-bottom:12px;">🔒</div>
      <h2 style="font-weight:900;margin-bottom:8px;" data-i18n="admin_access">Admin Access</h2>
      <p style="color:var(--muted);font-size:14px;margin-bottom:20px;" data-i18n="admin_pin_sub">Enter the Admin PIN to manage presentation templates.</p>
      <input type="password" id="pinInput" placeholder="Default: presentit123" data-i18n-placeholder="pin_placeholder" />
      <button class="btn btn-hot" style="width:100%;" id="btnAuth" data-i18n="unlock_admin">Unlock Admin</button>
      <div id="authError" style="color:var(--danger);font-size:13px;margin-top:12px;"></div>
    </div>
  </div>

  <div class="app hidden" id="mainApp">
    <header>
      <a class="logo" href="/">PresentIt Admin</a>
      <div class="nav-links">
        <div id="adminLangSelector"></div>
        <a class="btn btn-ghost" href="/host" data-i18n="host_room">Host Room</a>
        <button class="btn btn-danger btn-sm" id="btnLogout" data-i18n="lock_admin">Lock Admin</button>
      </div>
    </header>

    <!-- LIST VIEW -->
    <div id="viewList">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
        <div>
          <h1 style="font-size:26px;font-weight:900;" data-i18n="admin_title">Presentation Templates</h1>
          <p style="color:var(--muted);font-size:14px;" data-i18n="admin_deck_sub">Build deck templates for audience voting & presenter yapping.</p>
        </div>
        <button class="btn btn-primary" id="btnNewTemplate" data-i18n="create_template">+ Create Template</button>
      </div>

      <div class="template-list" id="templateList"></div>
    </div>

    <!-- EDITOR VIEW -->
    <div id="viewEditor" class="hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
        <button class="btn btn-ghost btn-sm" id="btnBack" data-i18n="back_to_list">← Back to List</button>
        <button class="btn btn-hot" id="btnSaveTemplate" data-i18n="save_template">Save Template</button>
      </div>

      <div class="card">
        <label data-i18n="template_name">Template Name</label>
        <input type="text" id="tplName" placeholder="e.g. Crazy Tech Keynote" data-i18n-placeholder="tpl_name_placeholder" />

        <label data-i18n="template_desc">Description</label>
        <input type="text" id="tplDesc" placeholder="e.g. Absurd prompts for office parties" data-i18n-placeholder="tpl_desc_placeholder" />
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h2 style="font-size:20px;font-weight:800;" data-i18n="slides_title">Slides</h2>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost btn-sm" onclick="addSlide('text_options')" data-i18n="add_only_text">+ Only Text</button>
          <button class="btn btn-ghost btn-sm" onclick="addSlide('photo_options')" data-i18n="add_only_photos">+ Only Photos</button>
          <button class="btn btn-ghost btn-sm" onclick="addSlide('photo_and_text')" data-i18n="add_text_photo">+ Text with Photo</button>
          <button class="btn btn-ghost btn-sm" onclick="addSlide('predefined')" data-i18n="add_predefined">+ Predefined Text</button>
        </div>
      </div>

      <div id="slidesContainer"></div>
    </div>
  </div>

  <script>
    let adminToken = localStorage.getItem('presentit_admin_token') || '';
    let currentTemplates = [];
    let editingTemplateId = null;
    let currentSlides = [];

    const authModal = document.getElementById('authModal');
    const mainApp = document.getElementById('mainApp');

    if (typeof renderLangSelector === 'function') {
      renderLangSelector('adminLangSelector');
    }

    if (adminToken) {
      authModal.classList.add('hidden');
      mainApp.classList.remove('hidden');
      loadTemplates();
    }

    document.getElementById('btnAuth').addEventListener('click', async () => {
      const pin = document.getElementById('pinInput').value.trim();
      try {
        const res = await fetch('/api/admin/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pin })
        });
        const data = await res.json();
        if (data.success) {
          adminToken = data.token;
          localStorage.setItem('presentit_admin_token', adminToken);
          authModal.classList.add('hidden');
          mainApp.classList.remove('hidden');
          loadTemplates();
        } else {
          document.getElementById('authError').textContent = data.error || 'Invalid PIN';
        }
      } catch (err) {
        document.getElementById('authError').textContent = err.message;
      }
    });

    document.getElementById('btnLogout').addEventListener('click', () => {
      localStorage.removeItem('presentit_admin_token');
      location.reload();
    });

    async function loadTemplates() {
      try {
        const res = await fetch('/api/templates');
        currentTemplates = await res.json();
        renderTemplateList();
      } catch (err) {
        alert('Failed to load templates: ' + err.message);
      }
    }

    window.addEventListener('languageChanged', () => {
      renderTemplateList();
      renderSlides();
    });

    function renderTemplateList() {
      const container = document.getElementById('templateList');
      container.innerHTML = '';

      if (!currentTemplates.length) {
        container.innerHTML = `<div style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px;">${esc(t('no_templates_yet'))}</div>`;
        return;
      }

      currentTemplates.forEach(tItem => {
        const el = document.createElement('div');
        el.className = 'template-card';
        const slideCount = tItem.slides ? tItem.slides.length : 0;
        const slideWord = t('slide');
        el.innerHTML = `
          <div>
            <h3>${esc(tItem.name)}</h3>
            <p>${esc(tItem.description || '')}</p>
            <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">📊 ${slideCount} ${slideWord}${slideCount !== 1 ? 's' : ''}</div>
          </div>
          <div class="actions">
            <button class="btn btn-ghost btn-sm" onclick="editTemplate('${tItem.id}')">${esc(t('edit'))}</button>
            <button class="btn btn-danger btn-sm" onclick="deleteTemplate('${tItem.id}')">${esc(t('delete'))}</button>
          </div>
        `;
        container.appendChild(el);
      });
    }

    document.getElementById('btnNewTemplate').addEventListener('click', () => {
      editingTemplateId = null;
      document.getElementById('tplName').value = '';
      document.getElementById('tplDesc').value = '';
      currentSlides = [
        { slide_type: 'predefined', question: 'Introduction', content_text: 'Welcome to my presentation!' },
        { slide_type: 'text_options', question: 'What numbers do you like?', options: ['One', 'Two', 'Three'] }
      ];
      renderSlides();
      showView('Editor');
    });

    function editTemplate(id) {
      const tItem = currentTemplates.find(item => item.id === id);
      if (!tItem) return;
      editingTemplateId = tItem.id;
      document.getElementById('tplName').value = tItem.name;
      document.getElementById('tplDesc').value = tItem.description || '';
      currentSlides = JSON.parse(JSON.stringify(tItem.slides || []));
      renderSlides();
      showView('Editor');
    }

    async function deleteTemplate(id) {
      if (!confirm('Are you sure you want to delete this template?')) return;
      try {
        const res = await fetch(`/api/templates/${id}`, {
          method: 'DELETE',
          headers: { 'x-admin-token': adminToken }
        });
        if (res.ok) {
          loadTemplates();
        } else {
          alert('Delete failed');
        }
      } catch (err) {
        alert(err.message);
      }
    }

    document.getElementById('btnBack').addEventListener('click', () => showView('List'));

    function showView(v) {
      document.getElementById('viewList').classList.toggle('hidden', v !== 'List');
      document.getElementById('viewEditor').classList.toggle('hidden', v !== 'Editor');
    }

    function addSlide(type) {
      if (type === 'text_options') {
        currentSlides.push({ slide_type: 'text_options', question: 'What is your pick?', options: ['Option A', 'Option B'] });
      } else if (type === 'photo_options') {
        currentSlides.push({ slide_type: 'photo_options', question: 'What is better?', options: [
          { id: '1', caption: 'Cute dog', image_url: 'https://images.unsplash.com/photo-1517849845537-4d257902454a?w=400' },
          { id: '2', caption: 'Cute cat', image_url: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400' }
        ]});
      } else if (type === 'photo_and_text') {
        currentSlides.push({ slide_type: 'photo_and_text', question: 'The topic of my presentation is:', image_url: 'https://images.unsplash.com/photo-1551836022-d5d88e9218df?w=400', content_text: 'Explanation caption' });
      } else if (type === 'predefined') {
        currentSlides.push({ slide_type: 'predefined', question: 'Important Fact', content_text: 'This is set on template and cannot be voted on.' });
      }
      renderSlides();
    }

    function removeSlide(idx) {
      currentSlides.splice(idx, 1);
      renderSlides();
    }

    function renderSlides() {
      const container = document.getElementById('slidesContainer');
      container.innerHTML = '';

      currentSlides.forEach((s, idx) => {
        const div = document.createElement('div');
        div.className = 'slide-item';

        let typeBadge = '';
        if (s.slide_type === 'text_options') typeBadge = `<span class="badge-type badge-text">${esc(t('add_only_text').replace('+ ',''))}</span>`;
        if (s.slide_type === 'photo_options') typeBadge = `<span class="badge-type badge-photo">${esc(t('add_only_photos').replace('+ ',''))}</span>`;
        if (s.slide_type === 'photo_and_text') typeBadge = `<span class="badge-type badge-textphoto">${esc(t('add_text_photo').replace('+ ',''))}</span>`;
        if (s.slide_type === 'predefined') typeBadge = `<span class="badge-type badge-predefined">${esc(t('add_predefined').replace('+ ',''))}</span>`;

        div.innerHTML = `
          <div class="slide-header">
            <span class="slide-number">${esc(t('slide'))} ${idx + 1} — ${typeBadge}</span>
            <button class="btn btn-danger btn-sm" onclick="removeSlide(${idx})">${esc(t('delete_slide'))}</button>
          </div>
          <label>${esc(t('prompt_title_label'))}</label>
          <input type="text" value="${esc(s.question || '')}" onchange="currentSlides[${idx}].question = this.value" placeholder="${esc(t('enter_prompt_placeholder'))}" />
          <div id="slideContent_${idx}"></div>
        `;

        container.appendChild(div);

        const contentEl = document.getElementById(`slideContent_${idx}`);

        if (s.slide_type === 'text_options') {
          contentEl.innerHTML = `
            <label>${esc(t('text_options_label'))}</label>
            ${(s.options || []).map((opt, oIdx) => `
              <div class="option-row">
                <input type="text" value="${esc(opt)}" onchange="currentSlides[${idx}].options[${oIdx}] = this.value" placeholder="Option ${oIdx+1}" />
                <button class="btn btn-ghost btn-sm" onclick="currentSlides[${idx}].options.splice(${oIdx},1); renderSlides();">X</button>
              </div>
            `).join('')}
            <button class="btn btn-ghost btn-sm" onclick="currentSlides[${idx}].options.push('New Option'); renderSlides();">${esc(t('add_option'))}</button>
          `;
        } else if (s.slide_type === 'photo_options') {
          contentEl.innerHTML = `
            <label>${esc(t('photo_options_label'))}</label>
            ${(s.options || []).map((opt, oIdx) => `
              <div class="option-row">
                <img class="img-preview" src="${opt.image_url || ''}" />
                <input type="text" value="${esc(opt.caption || '')}" onchange="currentSlides[${idx}].options[${oIdx}].caption = this.value" placeholder="${esc(t('caption_placeholder'))}" />
                <input type="file" accept="image/*" onchange="uploadImage(this, ${idx}, ${oIdx})" />
                <button class="btn btn-ghost btn-sm" onclick="uploadImageFromUrl(${idx}, ${oIdx})">${esc(t('import_url'))}</button>
                <button class="btn btn-ghost btn-sm" onclick="currentSlides[${idx}].options.splice(${oIdx},1); renderSlides();">X</button>
              </div>
            `).join('')}
            <button class="btn btn-ghost btn-sm" onclick="currentSlides[${idx}].options.push({id: Date.now().toString(), caption:'New Photo', image_url:''}); renderSlides();">${esc(t('add_photo_option'))}</button>
          `;
        } else if (s.slide_type === 'photo_and_text') {
          contentEl.innerHTML = `
            <label>${esc(t('photo_text_options_label'))}</label>
            ${(s.options || []).map((opt, oIdx) => `
              <div class="option-row">
                <img class="img-preview" src="${opt.image_url || ''}" />
                <input type="text" value="${esc(opt.caption || opt.text || '')}" onchange="currentSlides[${idx}].options[${oIdx}].caption = this.value; currentSlides[${idx}].options[${oIdx}].text = this.value;" placeholder="${esc(t('caption_placeholder'))}" />
                <input type="file" accept="image/*" onchange="uploadImage(this, ${idx}, ${oIdx})" />
                <button class="btn btn-ghost btn-sm" onclick="uploadImageFromUrl(${idx}, ${oIdx})">${esc(t('import_url'))}</button>
                <button class="btn btn-ghost btn-sm" onclick="currentSlides[${idx}].options.splice(${oIdx},1); renderSlides();">X</button>
              </div>
            `).join('')}
            <button class="btn btn-ghost btn-sm" onclick="if(!currentSlides[${idx}].options) currentSlides[${idx}].options=[]; currentSlides[${idx}].options.push({id: Date.now().toString(), caption:'New Text Option', image_url:''}); renderSlides();">${esc(t('add_photo_text_option'))}</button>
          `;
        } else if (s.slide_type === 'predefined') {
          contentEl.innerHTML = `
            <label>${esc(t('predefined_slide_label'))}</label>
            <textarea rows="3" onchange="currentSlides[${idx}].content_text = this.value">${esc(s.content_text || '')}</textarea>
          `;
        }
      });
    }

    async function uploadImage(fileInput, slideIdx, optionIdx) {
      if (!fileInput.files[0]) return;
      const formData = new FormData();
      formData.append('image', fileInput.files[0]);
      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.url) {
          currentSlides[slideIdx].options[optionIdx].image_url = data.url;
          renderSlides();
        }
      } catch (err) { alert('Upload failed: ' + err.message); }
    }

    async function uploadImageFromUrl(slideIdx, optionIdx) {
      const url = prompt('Enter Image URL to download and save locally:');
      if (!url || !url.trim()) return;
      try {
        const res = await fetch('/api/upload-url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url.trim() })
        });
        const contentType = res.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          throw new Error('Server returned non-JSON response. Server is restarting.');
        }
        const data = await res.json();
        if (data.url) {
          currentSlides[slideIdx].options[optionIdx].image_url = data.url;
          renderSlides();
        } else {
          alert('Import failed: ' + (data.error || 'Unknown error'));
        }
      } catch (err) {
        alert('URL import error: ' + err.message);
      }
    }

    async function uploadSlideImage(fileInput, slideIdx) {
      if (!fileInput.files[0]) return;
      const formData = new FormData();
      formData.append('image', fileInput.files[0]);
      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.url) {
          currentSlides[slideIdx].image_url = data.url;
          renderSlides();
        }
      } catch (err) { alert('Upload failed: ' + err.message); }
    }

    document.getElementById('btnSaveTemplate').addEventListener('click', async () => {
      const name = document.getElementById('tplName').value.trim();
      const description = document.getElementById('tplDesc').value.trim();

      if (!name) return alert('Template Name is required');

      const payload = { name, description, slides: currentSlides };

      try {
        const url = editingTemplateId ? `/api/templates/${editingTemplateId}` : '/api/templates';
        const method = editingTemplateId ? 'PUT' : 'POST';

        const res = await fetch(url, {
          method,
          headers: {
            'Content-Type': 'application/json',
            'x-admin-token': adminToken
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert('Template saved successfully!');
          loadTemplates();
          showView('List');
        } else {
          const err = await res.json();
          alert('Save failed: ' + (err.error || 'Unknown error'));
        }
      } catch (err) {
        alert(err.message);
      }
    });

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
